<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة مريم لتعلّم العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ef;--ink:#1d2b33;--card:#fff;--teal:#0f6b6f;--sun:#f4b63f;--rose:#d9487a;--ok:#1f8a4c;--bad:#c23b3b;--line:#e4dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14232a;--ink:#f3ecdc;--card:#1d333c;--line:#34505a;--teal:#4fc3c8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.9;font-size:18px}
header{background:var(--teal);color:#fff;padding:22px 18px;text-align:center}
header h1{font-family:'Reem Kufi',Cairo,sans-serif;margin:0;font-size:30px}
header p{margin:4px 0 0;opacity:.95}
#stars{background:var(--sun);color:#3a2a00;border-radius:20px;padding:2px 14px;display:inline-block;margin-top:8px;font-weight:800}
nav{display:flex;gap:8px;padding:12px;max-width:820px;margin:auto}
nav button{flex:1;padding:10px;border:2px solid var(--teal);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;font-weight:800;cursor:pointer}
nav button.on{background:var(--teal);color:#fff}
main{max-width:820px;margin:auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0}
h2{font-family:'Reem Kufi',Cairo,sans-serif;color:var(--teal);margin:.2em 0}
.pick{display:block;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.pick:hover{border-color:var(--teal)}
.pick.ok{border-color:var(--ok);background:#1f8a4c22}.pick.no{border-color:var(--bad);background:#c23b3b22}
.btn{background:var(--rose);color:#fff;border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:800;cursor:pointer}
textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--card);color:var(--ink)}
.fb{margin-top:8px;padding:10px 12px;border-radius:12px;font-weight:600}
.fb.g{background:#1f8a4c22;border-right:5px solid var(--ok)}.fb.b{background:#c23b3b22;border-right:5px solid var(--bad)}
.tag{display:inline-block;background:var(--sun);color:#3a2a00;border-radius:10px;padding:0 10px;font-size:14px;font-weight:800}
.ex{background:#f4b63f26;border-radius:10px;padding:2px 12px;margin:6px 0}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
</style>
</head>
<body>
<header><h1>🌟 منصة مريم لتعلّم العربية 🌟</h1><p>الصف الرابع الابتدائي – الوحدة الأولى: أنا وحلمي</p><span id="stars">⭐ 0</span></header>
<nav><button data-t="learn" class="on">📖 الشرح</button><button data-t="practice">✏️ الأسئلة</button><button data-t="exam">🏆 الاختبار</button></nav>
<main id="app"></main>
<script>
// ====== المحتوى (أضيفي دروساً جديدة هنا بنفس الشكل) ======
const UNITS=[
{id:'dream',kind:'درس قراءة',title:'صندوق الأحلام',
 explain:`<p>أهلاً بكِ يا مريم! في هذا الدرس تتحدث <b>ياسمين</b> عن أحلامها وأهدافها، ثم تتفق مع أصدقائها على كتابة أهدافهم ووضعها في <b>صندوق الأحلام</b>.</p>
 <div class="ex"><b>🔑 معاني ومفاهيم:</b><br>• <b>الفكرة العامة:</b> هي التي يتحدث عنها النص كله.<br>• <b>الفكرة الفرعية:</b> هي التي يتحدث عنها جزء من النص فقط.<br>• <b>مقولة «العلم أمانة»:</b> أي أن علينا أن نستعمل علمنا في الخير ولا نضيّعه.</div>
 <p>💡 تذكّري: لكل هدفٍ خطةٌ، والأحلام تتحقق بالصبر والعمل خطوةً بخطوة.</p>`,
 q:[
 {t:'tf',q:'الفكرة العامة هي التي يتحدث عنها النص كله.',a:true,why:'أما الفكرة الفرعية فيتحدث عنها جزء من النص فقط.'},
 {t:'mcq',q:'الفكرة التي يتحدث عنها جزء من النص فقط تُسمى:',o:['الفكرة العامة','الفكرة الفرعية','العنوان'],a:1,why:'الفرعية = جزء من النص.'},
 {t:'text',q:'ماذا فهمتِ من مقولة «العلم أمانة»؟ وكيف نستخدمه في الخير؟',k:['امان','خير','نفع','ساعد','لا نضيع','نحافظ','نعلم','نشر'],model:'العلم أمانة: أي نحافظ عليه ونستعمله فيما ينفع الناس، مثل مساعدة الآخرين وتعليمهم.'}
 ]},
{id:'wordtypes',kind:'قاعدة نحوية',title:'أنواع الكلمة',
 explain:`<p>الكلمة في اللغة العربية ثلاثة أنواع:</p>
 <div class="ex"><b>١) الاسم:</b> يدل على إنسان أو حيوان أو جماد أو نبات أو صفة.<br>أمثلة: <b>ياسمين</b> (إنسان) – <b>الأسد</b> (حيوان) – <b>منزل</b> (جماد) – <b>وردة</b> (نبات) – <b>جميلة</b> (صفة).</div>
 <div class="ex"><b>٢) الفعل:</b> يدل على حدوث شيء في زمن معين، وهو ثلاثة أنواع: <b>ماضٍ – مضارع – أمر</b>.<br>أمثلة: <b>خطّط</b> (ماضٍ) – <b>تحب</b> (مضارع) – <b>اكتب</b> (أمر).</div>
 <div class="ex"><b>٣) الحرف:</b> لا يعطي معنىً كاملاً بمفرده، ويحتاج إلى كلمة أخرى توضّح معناه. مثل: <b>في – إلى – عن – و – بـ</b>.</div>
 <p>✅ <b>القاعدة المستنتجة:</b> الكلمة إما اسم أو فعل أو حرف.</p>`,
 q:[
 {t:'tf',q:'كلمة (الأسد) تدل على حيوان، لذلك هي اسم.',a:true,why:'كل كلمة تدل على إنسان أو حيوان أو جماد أو نبات أو صفة فهي اسم.'},
 {t:'mcq',q:'نوع كلمة (تحب) في جملة: ياسمين تحب القراءة:',o:['اسم','فعل مضارع','حرف'],a:1,why:'(تحب) تدل على حدوث شيء الآن، فهي فعل مضارع.'},
 {t:'mcq',q:'كلمة (اكتب) فعل:',o:['ماضٍ','مضارع','أمر'],a:2,why:'(اكتب) تطلب فعل شيء، فهي فعل أمر.'},
 {t:'text',q:'لماذا تُعدّ كلمة (في) حرفاً؟',k:['معنى كامل','معنى كامل','لا تعطي','لا يفهم','وحدها','بمفردها','تحتاج'],model:'لأنها لا تعطي معنىً كاملاً بمفردها، وتحتاج إلى كلمة أخرى توضّح معناها.'}
 ]}
];
const EXAM=[
 {t:'tf',q:'(صح أم خطأ) الفكرة الفرعية هي التي يتحدث عنها النص كله.',a:false,why:'هذه هي الفكرة العامة، أما الفرعية فتخص جزءاً من النص.'},
 {t:'mcq',q:'(اختاري) كلمة (وردة) تدل على:',o:['إنسان','نبات','صفة'],a:1,why:'الوردة نبات، فهي اسم.'},
 {t:'text',q:'(علّلي) كلمة (في) حرف.',k:['معنى كامل','لا تعطي','وحدها','بمفردها','تحتاج'],model:'لأنها لا تعطي معنىً كاملاً بمفردها.'},
 {t:'text',q:'(صوّبي الخطأ) كلمة (تحب) فعل ماضٍ.',k:['مضارع'],model:'الصواب: كلمة (تحب) فعل مضارع.'},
 {t:'text',q:'(أخرجي من الجملة) «ياسمين تحب القراءة»: اسماً وفعلاً.',k:['ياسمين','القراءة','تحب'],all:2,model:'الاسم: ياسمين (أو القراءة)، والفعل: تحب.'},
 {t:'text',q:'(اشرحي) ما معنى أن «الأحلام تتحقق خطوة بخطوة»؟',k:['صبر','عمل','خطه','تدريج','اجتهاد','كل يوم','نبدا'],model:'أي أننا نحقق أحلامنا بالصبر والعمل والاجتهاد شيئاً فشيئاً، لا مرة واحدة.'}
];
// ====== المحرّك ======
const PRAISE=['أحسنتِ يا مريم! 🌟','رائع جداً! أنتِ نجمة! ⭐','ممتازة! استمري يا بطلة! 🏅','إجابة مذهلة! 👏','يا لكِ من متألقة! 🎉'];
const TRY=['لا بأس يا مريم، المحاولة شجاعة! 💪','قريبة جداً! تعلّمي منها وانطلقي 🚀','كل خطأ خطوة نحو التميز 🌱'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
let stars=0,tab='learn',cur=0,examScore=0,examDone=0;
const $=s=>document.querySelector(s),app=$('#app');
const addStar=n=>{stars+=n;$('#stars').textContent='⭐ '+stars};
function fb(el,ok,msg){let d=document.createElement('div');d.className='fb '+(ok?'g':'b');d.innerHTML=(ok?pick(PRAISE):pick(TRY))+'<br>'+msg;el.appendChild(d)}
function render(q,onDone){
 const box=document.createElement('div');box.className='card';box.innerHTML='<b>'+q.q+'</b>';let done=false;
 const fin=ok=>{if(done)return;done=true;if(ok)addStar(1);onDone&&onDone(ok)};
 if(q.t==='tf'||q.t==='mcq'){
  const opts=q.t==='tf'?['صح ✔️','خطأ ✖️']:q.o,ans=q.t==='tf'?(q.a?0:1):q.a;
  opts.forEach((o,i)=>{const b=document.createElement('button');b.className='pick';b.textContent=o;
   b.onclick=()=>{if(done)return;const ok=i===ans;b.classList.add(ok?'ok':'no');
    if(!ok)box.querySelectorAll('.pick')[ans].classList.add('ok');
    fb(box,ok,(ok?'':'الإجابة الصحيحة: '+opts[ans]+'. ')+q.why);fin(ok)};box.appendChild(b)});
 }else{
  const ta=document.createElement('textarea');ta.placeholder='اكتبي إجابتك هنا بأسلوبك...';
  const b=document.createElement('button');b.className='btn';b.textContent='تحقّقي من إجابتي';
  b.onclick=()=>{if(done||!ta.value.trim())return;const t=norm(ta.value);
   const hits=q.k.filter(k=>t.includes(norm(k))).length;const ok=hits>=(q.all||1);
   fb(box,ok,(ok?'إجابتك صحيحة، وكل صياغة سليمة تُقبل! ':'')+'نموذج إجابة: '+q.model);fin(ok)};
  box.append(ta,document.createElement('br'),b);
 }
 return box;
}
function show(){
 app.innerHTML='';
 if(tab==='exam')return exam();
 const row=document.createElement('div');row.className='card';
 UNITS.forEach((u,i)=>{const b=document.createElement('button');b.className='pick'+(i===cur?' ok':'');
  b.innerHTML=`<span class="tag">${u.kind}</span> ${u.title}`;b.onclick=()=>{cur=i;show()};row.appendChild(b)});
 app.appendChild(row);
 const u=UNITS[cur];
 if(tab==='learn'){const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${u.title}</h2>${u.explain}`;
  const go=document.createElement('button');go.className='btn';go.textContent='هيا نتدرّب ✏️';go.onclick=()=>{tab='practice';sync();show()};c.appendChild(go);app.appendChild(c)}
 else{const h=document.createElement('h2');h.textContent='أسئلة: '+u.title;app.appendChild(h);u.q.forEach(q=>app.appendChild(render(q)))}
}
function exam(){
 examScore=0;examDone=0;const h=document.createElement('h2');h.textContent='🏆 اختبار مريم التفاعلي';app.appendChild(h);
 const res=document.createElement('div');res.className='card';res.textContent='أجيبي عن كل الأسئلة لتري نتيجتك!';
 EXAM.forEach(q=>app.appendChild(render(q,ok=>{examDone++;if(ok)examScore++;
  if(examDone===EXAM.length){const p=examScore/EXAM.length;
   res.innerHTML=`<h2>نتيجتك: ${examScore} من ${EXAM.length}</h2>`+(p>=.8?'🏆 مبهرة يا مريم! أنتِ بطلة العربية!':p>=.5?'🌟 أداء جميل! راجعي الشرح وستصلين للقمة.':'💪 بداية طيبة! أعيدي قراءة الشرح وجرّبي مرة أخرى، وأنا أؤمن بكِ.');
   addStar(examScore)}})));
 app.appendChild(res);
}
function sync(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sync();show()});
show();
</script>
</body>
</html>
